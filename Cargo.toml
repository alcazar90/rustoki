[package]
name = "rustoki"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
authors = ["Cristóbal Alcázar"]
license = "MIT"
description = "A Rust static site generator with a Flexoki-themed default look."

[[bin]]
name = "rustoki"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
toml = "0.8"
walkdir = "2"
regex = "1"
pulldown-cmark = "0.13"
pulldown-latex = "0.7"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
once_cell = "1"
minijinja = "2"
time = { version = "0.3", default-features = false, features = ["std"] }
ureq = "2"
serde_json = "1"
imagesize = "0.15"
tiny_http = "0.12"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
